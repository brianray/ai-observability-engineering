name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Install promtool
        run: |
          sudo apt-get update
          sudo apt-get install -y prometheus

      - name: Run unit tests
        run: python -m pytest tests/unit

      - name: Validate Prometheus rules
        run: promtool check rules chapters/ch08/pricing_rules.yml

      - name: Validate Chapter 8 PromQL expressions
        run: python -m pytest tests/unit/test_ch08_prometheus_artifacts.py -k dashboard_queries_parse
