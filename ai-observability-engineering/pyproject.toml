[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-observability-engineering"
version = "0.1.0"
description = "Companion framework, testing harness, and example simulator for AI Observability Engineering (Pearson Addison-Wesley)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brian Ray" }]
keywords = ["observability", "opentelemetry", "llm", "genai", "evaluation", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "opentelemetry-api>=1.30",
  "opentelemetry-sdk>=1.30",
  "opentelemetry-semantic-conventions>=0.51b0",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.30"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
all = ["ai-observability-engineering[otlp,dev]"]

[project.scripts]
aiobs-sim = "simulator.app:main"

[project.urls]
Homepage = "https://github.com/ai-observability-engineering/ai-observability-engineering"
Issues = "https://github.com/ai-observability-engineering/ai-observability-engineering/issues"



[tool.setuptools.packages.find]
where = ["src", "."]
include = ["aiobs*", "chapters*", "simulator*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
  "slow: takes more than a second",
  "network: requires a live model provider (skipped by default)",
]
filterwarnings = ["error::DeprecationWarning:aiobs.*"]

[tool.coverage.run]
source = ["src/aiobs", "chapters", "simulator"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Nested `with` blocks in the harness tests mirror how readers actually
# write them, so SIM117 is off here on purpose.
"tests/*" = ["N802", "N803", "SIM117"]

[tool.mypy]
python_version = "3.10"
packages = ["aiobs"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
