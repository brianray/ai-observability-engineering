[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-observability-engineering"
version = "0.1.0"
description = "Companion framework, testing harness, and example simulator for AI Observability Engineering (Pearson Addison-Wesley)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Brian Ray" }]
keywords = ["observability", "opentelemetry", "llm", "genai", "evaluation", "agents"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "openai==1.109.1",
  "fastapi==0.141.1",
  "opentelemetry-api==1.44.0",
  "opentelemetry-sdk==1.44.0",
  "opentelemetry-semantic-conventions>=0.51b0",
  "PyYAML==6.0.3",
  "scikit-learn==1.9.1",
  # scipy 1.18.x requires Python 3.12+, but this project declares
  # requires-python >= 3.10 and ships 3.10/3.11 classifiers. Without the
  # marker, `pip install -e .` fails outright on 3.10 and 3.11 with "no
  # matching distribution", which makes the declared floor a fiction.
  "scipy==1.18.1; python_version >= '3.12'",
  "scipy>=1.15,<1.18; python_version < '3.12'",
]

[project.optional-dependencies]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.30"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
# Optional, and deliberately so. The book's contract is that every
# example runs offline with no key and no service, and these pull large
# dependency trees. The chapters that use them degrade gracefully: their
# tests skip, and the pinned-surface tests that guard the listings skip
# with them.
agents = ["langgraph>=1.2,<2", "langgraph-checkpoint>=4,<5"]
evals = ["ragas>=0.4,<0.5"]
all = ["ai-observability-engineering[otlp,dev,agents,evals]"]

[project.scripts]
aiobs-sim = "simulator.app:main"

[project.urls]
Homepage = "https://github.com/ai-observability-engineering/ai-observability-engineering"
Issues = "https://github.com/ai-observability-engineering/ai-observability-engineering/issues"



[tool.setuptools.packages.find]
where = ["src", "."]
include = ["aiobs*", "chapters*", "simulator*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
  "slow: takes more than a second",
  "network: requires a live model provider (skipped by default)",
]
filterwarnings = ["error::DeprecationWarning:aiobs.*"]

[tool.coverage.run]
source = ["src/aiobs", "chapters", "simulator"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Nested `with` blocks in the harness tests mirror how readers actually
# write them, so SIM117 is off here on purpose.
"tests/*" = ["N802", "N803", "SIM117"]

[tool.mypy]
python_version = "3.10"
packages = ["aiobs"]
mypy_path = "src"
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
